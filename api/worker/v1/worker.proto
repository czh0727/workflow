syntax = "proto3";

package worker.v1;

import "google/api/annotations.proto";

option go_package = "git.sotatts.online/matrix/matrix/workflow/api-server/api/worker/v1;v1";

// WorkerService 提供 Worker 进程的管理 API。
service WorkerService {
  // Healthz 检查 Worker 进程是否存活。
  rpc Healthz(HealthzRequest) returns (HealthzResponse) {
    option (google.api.http) = {get: "/live"};
  }

  // Readyz 检查 Worker 是否可以接收任务。
  rpc Readyz(ReadyzRequest) returns (ReadyzResponse) {
    option (google.api.http) = {get: "/ready"};
  }
}

message HealthzRequest {}

message HealthzResponse {}

message ReadyzRequest {}

message ReadyzResponse {}
