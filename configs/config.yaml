server:
  http:
    addr: 0.0.0.0:8080
    timeout: 1s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 1s
data:
  redis:
    addr: 127.0.0.1:6379
    read_timeout: 0.2s
    write_timeout: 0.2s
  temporal:
    addr: 127.0.0.1:7233
    namespace: default
    task_queue: workflow
  maas_api_gateway:
    base_url: http://api-gateway
    timeout: 30s
    service_token: ""
