syntax = "proto3";
package kratos.api;

option go_package = "git.sotatts.online/matrix/matrix/workflow/api-server/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    // source 由 Kratos 环境配置源从 PG_DSN 填充。
    string source = 2;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  message Temporal {
    string addr = 1;
    string namespace = 2;
    string task_queue = 3;
  }
  message MaasApiGateway {
    string base_url = 1;
    google.protobuf.Duration timeout = 2;
    string service_token = 3;
  }
  Database database = 1;
  Redis redis = 2;
  Temporal temporal = 3;
  MaasApiGateway maas_api_gateway = 4;
}
